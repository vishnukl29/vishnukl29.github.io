<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v3shn | VISHNU PRASAD</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #FFD700;
  --gold2: #FFA500;
  --red: #FF2244;
  --ink: #0a0612;
  --white: #F5F0FF;
  --teal: #00e5ff;
  --sakura: #FFB7C5;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--ink);
  color: var(--white);
  font-family: 'Rajdhani', 'Noto Sans JP', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

/* CURSOR */
.cursor {
  position: fixed; width: 18px; height: 18px;
  border: 2px solid var(--gold); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transition: transform 0.15s ease, background 0.15s;
  transform: translate(-50%, -50%);
}
.cursor-dot {
  position: fixed; width: 5px; height: 5px;
  background: var(--red); border-radius: 50%;
  pointer-events: none; z-index: 9999;
  transform: translate(-50%, -50%);
}

/* INTRO */
#intro {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--ink);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  animation: introFade 0.8s ease 3.2s forwards;
}
@keyframes introFade { to { opacity:0; pointer-events:none; } }
.intro-logo {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(52px, 10vw, 110px);
  color: var(--teal);
  letter-spacing: 0.08em;
  text-shadow: 0 0 20px var(--teal), 0 0 60px rgba(0,229,255,0.3);
  animation: logoReveal 1s ease 0.3s both;
}
@keyframes logoReveal {
  from { opacity:0; transform:scale(0.8); filter:blur(14px); }
  to   { opacity:1; transform:none; }
}
.intro-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(9px, 1.6vw, 13px);
  letter-spacing: 0.45em;
  color: rgba(0,229,255,0.5);
  margin-top: 14px;
  animation: fadeUp 0.8s ease 1.2s both;
}
.intro-bar {
  width: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--teal), transparent);
  margin-top: 28px;
  animation: barExpand 1s ease 2s both;
}
@keyframes barExpand { to { width: min(320px, 65vw); } }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:none; }
}
.intro-caret {
  display: inline-block; width: 3px; height: 0.85em;
  background: var(--teal); margin-left: 3px;
  animation: blink 0.7s step-end infinite;
  vertical-align: middle;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* BG */
.bg-layer {
  position: fixed; inset: 0; z-index: 0;
  background-size: cover; background-position: center top;
  background-attachment: fixed;
}
.bg-desktop {
  background-image: url('https://raw.githubusercontent.com/vishnukl29/vishnukl29.github.io/7d273c4ba57b844d53832965b0dd4192c1ae24f8/ChatGPT%20Image%20Apr%2026%2C%202026%2C%2009_39_06%20AM.png');
}
.bg-mobile {
  display: none;
  background-image: url('https://raw.githubusercontent.com/vishnukl29/vishnukl29.github.io/a9436d76089e01fcaaec5162e88f07c41903ab80/ChatGPT%20Image%20Apr%2026%2C%202026%2C%2009_40_50%20AM.png');
}
@media (max-width: 640px) {
  .bg-desktop { display:none; }
  .bg-mobile  { display:block; }
}
.bg-overlay {
  position: fixed; inset: 0; z-index: 1;
  background: linear-gradient(to bottom,
    rgba(10,6,18,0.72) 0%,
    rgba(10,6,18,0.42) 40%,
    rgba(10,6,18,0.76) 80%,
    rgba(10,6,18,0.97) 100%);
}
.scanlines {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: repeating-linear-gradient(to bottom,
    transparent, transparent 3px,
    rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
  opacity: 0.28;
}

main { position: relative; z-index: 10; min-height: 100vh; }

/* TOP BAR — 3-column grid: tag | clock | nav */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 10px 22px;
  background: linear-gradient(to bottom, rgba(10,6,18,0.9), transparent);
  backdrop-filter: blur(3px);
}

/* Left — small v3shn label */
.topbar-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.28em;
  color: rgba(0,229,255,0.4);
  justify-self: start;
  user-select: none;
}

/* Center — 7-segment style clock */
.clock-wrap {
  justify-self: center;
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
}
.clock-digits {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(20px, 3.2vw, 34px);
  color: var(--teal);
  letter-spacing: 0.12em;
  text-shadow: 0 0 10px var(--teal), 0 0 24px rgba(0,229,255,0.22);
  position: relative;
}
/* Unlit ghost segments */
.clock-digits::before {
  content: attr(data-ghost);
  position: absolute; inset: 0;
  color: rgba(0,229,255,0.09);
  pointer-events: none;
  text-shadow: none;
}
.clock-ampm {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(8px, 1.1vw, 11px);
  letter-spacing: 0.38em;
  color: rgba(0,229,255,0.5);
  display: flex; align-items: center; gap: 6px;
}
.clock-pulse {
  width: 6px; height: 6px; background: var(--red);
  border-radius: 50%;
  animation: pulse 1s ease infinite; flex-shrink: 0;
}
@keyframes pulse {
  0%,100%{ box-shadow:0 0 0 0 rgba(255,34,68,0.6); }
  50%    { box-shadow:0 0 0 7px rgba(255,34,68,0); }
}

/* Right — nav */
.nav-links { display:flex; gap:22px; justify-self:end; }
.nav-links a {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; letter-spacing: 0.22em;
  color: rgba(245,240,255,0.5);
  text-decoration: none; text-transform: uppercase;
  transition: color 0.25s; position: relative;
}
.nav-links a::after {
  content:''; position:absolute; bottom:-3px; left:0;
  width:0; height:1px; background:var(--gold);
  transition: width 0.3s;
}
.nav-links a:hover { color:var(--gold); }
.nav-links a:hover::after { width:100%; }

/* HERO */
#hero {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 100px 24px 60px;
  position: relative;
}

.hero-name {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(34px, 7.5vw, 96px);
  font-weight: 900; line-height: 1;
  background: linear-gradient(135deg, var(--gold) 0%, #fff8dc 40%, var(--gold2) 70%, var(--red) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.05em;
  filter: drop-shadow(0 0 38px rgba(255,215,0,0.35));
  animation: nameReveal 1.2s cubic-bezier(.22,1,.36,1) 3.6s both;
}
@keyframes nameReveal {
  from { opacity:0; transform:scale(0.8) translateY(28px); filter:blur(16px); }
  to   { opacity:1; transform:none; filter:drop-shadow(0 0 38px rgba(255,215,0,0.35)); }
}
.glitch { position:relative; }
.glitch::before, .glitch::after {
  content: attr(data-text);
  position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--gold) 0%, #fff8dc 40%, var(--gold2) 70%, var(--red) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.glitch::before {
  animation: gl1 5s 5.5s infinite;
  clip-path: polygon(0 20%,100% 20%,100% 40%,0 40%);
  transform: translate(-3px,0);
}
.glitch::after {
  animation: gl2 5s 5.5s infinite;
  clip-path: polygon(0 60%,100% 60%,100% 75%,0 75%);
  transform: translate(3px,0);
  filter: hue-rotate(60deg);
}
@keyframes gl1 {
  0%,95%,100%{transform:translate(-3px,0);opacity:0}
  96%{transform:translate(-5px,2px);opacity:0.8}
  97%{transform:translate(2px,-1px);opacity:0.6}
  98%{transform:translate(-3px,0);opacity:0}
}
@keyframes gl2 {
  0%,95%,100%{transform:translate(3px,0);opacity:0}
  96%{transform:translate(5px,-2px);opacity:0.8}
  97%{transform:translate(-2px,1px);opacity:0.6}
  98%{transform:translate(3px,0);opacity:0}
}

.hero-location {
  margin-top: 18px;
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(10px, 1.8vw, 14px);
  letter-spacing: 0.32em;
  color: rgba(245,240,255,0.48);
  animation: fadeUp 0.9s ease 4.2s both;
}
.hero-location span { color: var(--sakura); }

.hero-quote {
  margin-top: 24px;
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(11px, 1.8vw, 14px);
  color: rgba(245,240,255,0.42);
  font-style: italic; letter-spacing: 0.06em;
  max-width: 380px; line-height: 1.75;
  animation: fadeUp 0.9s ease 4.5s both;
  border-left: 2px solid var(--red);
  padding-left: 14px; text-align: left;
}
.tcursor {
  display: inline-block; width: 2px; height: 1em;
  background: var(--gold); margin-left: 3px;
  animation: blink 0.75s step-end infinite;
  vertical-align: text-bottom;
}

.scroll-hint {
  position: absolute; bottom: 36px; left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  animation: fadeUp 1s ease 5s both;
}
.scroll-hint span {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 0.4em;
  color: rgba(245,240,255,0.28);
}
.scroll-arrow {
  width: 14px; height: 14px;
  border-right: 2px solid var(--gold);
  border-bottom: 2px solid var(--gold);
  transform: rotate(45deg);
  animation: scrollB 1.4s ease infinite;
}
@keyframes scrollB {
  0%,100%{transform:rotate(45deg) translate(0,0);opacity:0.5}
  50%{transform:rotate(45deg) translate(4px,4px);opacity:1}
}

/* PARTICLES */
.particles { position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden; }
.particle {
  position:absolute; border-radius:50%; opacity:0;
  animation: floatUp var(--dur,8s) var(--delay,0s) ease-in infinite;
}
@keyframes floatUp {
  0%  {opacity:0;transform:translateY(100vh) scale(0)}
  10% {opacity:var(--op,.5)}
  90% {opacity:var(--op,.5)}
  100%{opacity:0;transform:translateY(-10vh) scale(1.5) rotate(180deg)}
}

/* SECTIONS */
section { max-width:1000px; margin:0 auto; padding:80px 24px; }
.section-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; letter-spacing: 0.52em;
  color: var(--red); text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 14px;
}
.section-label::before { content:'';display:block;width:30px;height:1px;background:var(--red); }
.section-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(22px, 4vw, 42px);
  color: var(--gold); margin-bottom: 38px;
  filter: drop-shadow(0 0 16px rgba(255,215,0,0.3));
}
.section-box {
  border: 1px solid rgba(255,215,0,0.12);
  border-radius: 16px; padding: 40px 32px;
  background: rgba(10,6,18,0.55);
  backdrop-filter: blur(10px);
  position: relative; overflow: hidden;
}
.section-box::before {
  content:''; position:absolute; top:0; left:-100%;
  width:100%; height:2px;
  background: linear-gradient(90deg,transparent,var(--gold),var(--red),transparent);
  animation: bScan 4s linear infinite;
}
@keyframes bScan { to{left:100%} }

/* SKILLS */
.skills-grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
.skill-card {
  width:110px; height:110px;
  background: rgba(10,6,18,0.75);
  border: 1px solid rgba(255,215,0,0.2); border-radius:12px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
  cursor:none; overflow:hidden;
  transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
  backdrop-filter: blur(8px);
  animation: cardIn 0.6s ease both;
  position: relative;
}
@keyframes cardIn {
  from{opacity:0;transform:translateY(28px) scale(0.85)}
  to{opacity:1;transform:none}
}
.skill-card::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(135deg,rgba(255,215,0,0.08),transparent 60%);
  opacity:0; transition:opacity 0.3s;
}
.skill-card:hover { transform:translateY(-8px) scale(1.05); border-color:var(--gold); box-shadow:0 0 28px rgba(255,215,0,0.22); }
.skill-card:hover::before { opacity:1; }
.skill-card img { width:46px;height:46px;object-fit:contain; filter:drop-shadow(0 0 6px rgba(255,215,0,0.4)); transition:transform 0.3s,filter 0.3s; }
.skill-card:hover img { transform:scale(1.15) rotate(-3deg); filter:drop-shadow(0 0 14px rgba(255,215,0,0.7)); }
.skill-name { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:0.18em; color:rgba(245,240,255,0.62); }
.skill-card:hover .skill-name { color:var(--gold); }

/* CONTACT — icon circles only */
.contact-grid { display:flex; flex-wrap:wrap; gap:28px; justify-content:center; }
.c-btn {
  display:flex; align-items:center; justify-content:center;
  width:76px; height:76px;
  border: 1.5px solid rgba(255,215,0,0.22);
  border-radius:50%;
  background: rgba(10,6,18,0.72);
  text-decoration:none; cursor:none;
  position:relative; overflow:hidden;
  transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
  backdrop-filter: blur(8px);
}
.c-btn::before {
  content:''; position:absolute; inset:0; border-radius:50%;
  background: radial-gradient(circle,rgba(255,215,0,0.14) 0%,transparent 70%);
  opacity:0; transition:opacity 0.3s;
}
.c-btn:hover::before { opacity:1; }
.c-btn:hover {
  border-color: var(--gold);
  transform: translateY(-7px) scale(1.1);
  box-shadow: 0 12px 32px rgba(255,215,0,0.18), 0 0 0 2px rgba(255,215,0,0.07);
}
.c-btn svg { width:38px; height:38px; display:block; transition:transform 0.3s; }
.c-btn:hover svg { transform:scale(1.08); }
/* Tooltip */
.c-btn[data-tip]::after {
  content:attr(data-tip);
  position:absolute; bottom:-32px; left:50%;
  transform:translateX(-50%);
  font-family:'Share Tech Mono',monospace;
  font-size:9px; letter-spacing:0.18em;
  color:var(--gold); white-space:nowrap;
  opacity:0; transition:opacity 0.25s, bottom 0.25s;
  pointer-events:none;
}
.c-btn:hover[data-tip]::after { opacity:1; bottom:-26px; }

/* CORNER DECO */
.cdeco { position:fixed; z-index:8; pointer-events:none; }
.cdeco.tl{top:60px;left:12px} .cdeco.tr{top:60px;right:12px}
.cdeco.bl{bottom:12px;left:12px} .cdeco.br{bottom:12px;right:12px}

/* REVEAL */
.reveal { opacity:0; transform:translateY(38px); transition:opacity 0.8s ease,transform 0.8s ease; }
.reveal.visible { opacity:1; transform:none; }

/* FOOTER */
footer {
  text-align:center; padding:28px 24px 40px;
  font-family:'Share Tech Mono',monospace;
  font-size:10px; letter-spacing:0.28em;
  color:rgba(245,240,255,0.2);
}
footer span { color:var(--red); }

/* MOBILE */
@media (max-width:640px) {
  .nav-links { display:none; }
  #topbar { padding:10px 14px; }
  .clock-digits { font-size:18px; }
  .skill-card { width:88px;height:88px; }
  .section-box { padding:22px 14px; }
  .c-btn { width:64px;height:64px; }
  .c-btn svg { width:32px;height:32px; }
}
</style>
</head>

<script>
// Cursor
const cur = document.getElementById('cursor');
const dot = document.getElementById('cursorDot');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px';
  dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px';
});
document.querySelectorAll('a,.skill-card').forEach(el => {
  el.addEventListener('mouseenter',()=>cur.style.transform='translate(-50%,-50%) scale(2)');
  el.addEventListener('mouseleave',()=>cur.style.transform='translate(-50%,-50%) scale(1)');
});

// 12-hr Clock — 7-segment ghost effect
function tick() {
  const n = new Date();
  let h = n.getHours(), ap = h>=12?'PM':'AM';
  h = h%12||12;
  const t = `${String(h).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  const c = document.getElementById('clock');
  c.textContent = t;
  c.setAttribute('data-ghost', t.replace(/[0-9]/g,'8'));
  document.getElementById('ampm').textContent = ap;
}
tick(); setInterval(tick,1000);

// Typing quotes
const quotes = [
  "Code is the blade, silence is the sheath.",
  "Every bug defeated is a battle won.",
  "Build what others only dream of.",
  "The scroll of knowledge has no final page.",
];
let qi=0,ci=0,del=false;
const qEl=document.getElementById('qtext');
function type(){
  const q=quotes[qi];
  if(!del){qEl.textContent=q.slice(0,++ci);if(ci===q.length){del=true;setTimeout(type,2200);return;}}
  else{qEl.textContent=q.slice(0,--ci);if(ci===0){del=false;qi=(qi+1)%quotes.length;}}
  setTimeout(type,del?28:52);
}
setTimeout(type,4800);

// Particles
const pc=document.getElementById('particles');
['#FFD700','#FF2244','#00e5ff','#FFB7C5','#ffffff'].forEach(col=>{
  for(let i=0;i<5;i++){
    const p=document.createElement('div'); p.className='particle';
    const s=Math.random()*4+2;
    p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;background:${col};--dur:${6+Math.random()*10}s;--delay:${Math.random()*12}s;--op:${.3+Math.random()*.4};box-shadow:0 0 ${s*2}px ${col}`;
    pc.appendChild(p);
  }
});

// Scroll reveal
document.querySelectorAll('.reveal').forEach(r=>
  new IntersectionObserver(ents=>{ents.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});},{threshold:.15}).observe(r)
);

// Skill card stagger
const sg=document.getElementById('sg');
if(sg) new IntersectionObserver(ents=>{
  ents.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.skill-card').forEach((c,i)=>c.style.animationDelay=i*.08+'s');});
},{threshold:.1}).observe(sg);
</script>
